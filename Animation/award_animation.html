<meta charset="UTF-8">
<title>Minimal Awards Animation</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #fff9de;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .scene {
    position: relative;
    width: 530px;
    height: 410px;
    border-radius: 12px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    z-index: 0;
  }
  .stage {
    position: absolute;
    top: 0px;
    left: 110px;
    width: 315px;
    height: 250px;
    overflow: hidden;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .badge {
    position: absolute;
    width: 210px;
    height: 210px;
    object-fit: contain;
    opacity: 0;
    transform: translateX(265px);
  }
</style>

<script>
  const badges   = Array.from(document.querySelectorAll('.badge'));
  const N        = badges.length;
  const SLOT     = 1000;
  const DIST     = 265;
  const STAGE_HALF = 157.5;
  const BADGE_HALF = 105;
  const BADGE_W    = 210;

  // Next badge triggers when current has only 30% visible on left
  const TRIGGER_X      = -(STAGE_HALF + BADGE_HALF) + 0.30 * BADGE_W; // -199.5
  const START_INTERVAL = ((DIST - TRIGGER_X) / (DIST * 2)) * SLOT;    // ~876ms

  let idx = 0;

  function launch(badge) {
    badge.style.transition = 'none';
    badge.style.transform  = 'translateX(' + DIST + 'px)';
    badge.style.opacity    = '1';

    requestAnimationFrame(() => requestAnimationFrame(() => {
      badge.style.transition = 'transform ' + SLOT + 'ms linear';
      badge.style.transform  = 'translateX(-' + DIST + 'px)';
    }));

    setTimeout(() => {
      badge.style.transition = 'none';
      badge.style.opacity    = '0';
    }, SLOT + 20);

    setTimeout(() => {
      idx = (idx + 1) % N;
      launch(badges[idx]);
    }, START_INTERVAL);
  }

  launch(badges[0]);
</script>
