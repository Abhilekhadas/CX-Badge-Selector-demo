<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Catalogue — See your brand on every collateral</title>
<style>
  :root {
    --alabaster: #DCDCDD;
    --pale-slate: #C5C3C6;
    --iron: #46494C;
    --blue-slate: #4C5C68;
    --cyan: #FF6D05;
    --cyan-soft: #FFE6D4;
    --ink: #1F2125;
    --muted: #6B6E72;
    --line: #ECECEE;
    --bg: #F7F7F8;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; background-color: #ffffff; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background-color: transparent;
        background-attachment: fixed;
    line-height: 1.55;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    padding: 0;
    min-height: 100vh;
  }
  .page-frame {
    position: relative;
    height: 125vh;
    overflow: hidden;
    background: transparent;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; }

  /* AMBIENT BG MOTION */
  .bg-orbs {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .page-frame > nav,
  .page-frame > header,
  .page-frame > section,
  .page-frame > footer { position: relative; z-index: 1; }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    will-change: transform, background-color;
  }
  .orb-amber {
    width: 60vw; height: 60vh;
    bottom: -18vh; left: -14vw;
    animation:
      driftAmber 28s ease-in-out infinite alternate,
      hueShiftAmber 24s ease-in-out infinite alternate;
  }
  .orb-cyan {
    width: 55vw; height: 55vh;
    top: -12vh; right: -16vw;
    animation:
      driftCyan 32s ease-in-out infinite alternate,
      hueShiftCyan 30s ease-in-out infinite alternate;
  }
  .orb-mint {
    width: 38vw; height: 38vh;
    bottom: 4vh; left: 42vw;
    animation:
      driftMint 36s ease-in-out infinite alternate,
      hueShiftMint 26s ease-in-out infinite alternate;
  }
  @keyframes driftAmber {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(12vw, -6vh) scale(1.06); }
  }
  @keyframes driftCyan {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-10vw, 8vh) scale(1.05); }
  }
  @keyframes driftMint {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-8vw, -4vh) scale(1.1); }
  }
  @keyframes hueShiftAmber {
    0%   { background-color: rgba(248,225,170,0.45); }
    33%  { background-color: rgba(245,200,180,0.42); }
    66%  { background-color: rgba(240,220,160,0.42); }
    100% { background-color: rgba(250,210,165,0.45); }
  }
  @keyframes hueShiftCyan {
    0%   { background-color: rgba(190,220,235,0.42); }
    33%  { background-color: rgba(195,210,230,0.42); }
    66%  { background-color: rgba(205,225,235,0.42); }
    100% { background-color: rgba(195,225,225,0.42); }
  }
  @keyframes hueShiftMint {
    0%   { background-color: rgba(195,225,210,0.30); }
    50%  { background-color: rgba(210,225,215,0.30); }
    100% { background-color: rgba(200,220,215,0.30); }
  }
  @media (prefers-reduced-motion: reduce) {
    .orb { animation: none; }
  }

  /* CARD — shared shell */
  .card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: 0 1px 2px rgba(70,73,76,0.04), 0 12px 32px rgba(70,73,76,0.05);
  }
  .page-section {
    max-width: 1180px;
    margin: 0 auto 24px;
    padding: 0 28px;
  }

  /* NAV */
  nav.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 120px;
    max-width: none;
    margin: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    color: var(--iron);
    font-size: 17px;
    letter-spacing: -0.2px;
    text-decoration: none;
  }
  .brand-logo { display: inline-flex; align-items: center; text-decoration: none; }
  .brand-logo img { height: 24px; width: auto; display: block; }
  .nav-links {
    display: flex; align-items: center;
    gap: 24px;
    list-style: none;
    margin-left: auto;
  }
  .nav-links a {
    color: var(--iron);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--cyan); }
  .nav-cta {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .btn {
    font-family: inherit;
    cursor: pointer;
    border: none;
    padding: 11px 20px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.1px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
  }
  .btn-text {
    background: transparent;
    color: var(--iron);
    padding: 11px 16px;
  }
  .btn-text:hover { color: var(--cyan); }
  .btn-dark {
    background: var(--iron);
    color: var(--white);
  }
  .btn-dark:hover { background: var(--blue-slate); transform: translateY(-1px); }
  .btn-primary {
    background: var(--cyan);
    color: var(--white);
  }
  .btn-primary:hover { background: var(--iron); color: var(--white); transform: translateY(-1px); }
  .btn-label-stack {
    display: inline-grid;
    overflow: hidden;
  }
  .btn-label-stack > .btn-label {
    grid-area: 1 / 1;
    transition: opacity 0.22s ease, transform 0.28s ease;
    line-height: 1.2;
  }
  .btn-label-hover {
    opacity: 0;
    transform: translateY(8px);
  }
  .btn-primary:hover .btn-label-default {
    opacity: 0;
    transform: translateY(-8px);
  }
  .btn-primary:hover .btn-label-hover {
    opacity: 1;
    transform: translateY(0);
  }
  .btn-ghost {
    background: transparent;
    color: var(--iron);
    border: 1px solid var(--alabaster);
  }
  .btn-ghost:hover { border-color: var(--iron); }

  /* HERO */
  .hero {
    padding: 56px 0 32px;
    text-align: center;
    position: relative;
    margin-top: -5vh;
  }

  /* INTRO ANIMATION */
  @keyframes introFadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes introLaptop {
    from { opacity: 0; transform: translateX(-50%) translateY(calc(60px - 6%)) scale(0.97); }
    to   { opacity: 1; transform: translateX(-50%) translateY(-6%) scale(1); }
  }
  .hero h1,
  .hero .hero-sub,
  .hero .start-form,
  .hero .start-btn-wrap,
  .preview-stage {
    opacity: 0;
    animation-fill-mode: both;
    animation-timing-function: cubic-bezier(0.22, 0.9, 0.28, 1);
  }
  .hero h1              { animation: introFadeUp 0.7s 0.05s both; }
  .hero .hero-sub       { animation: introFadeUp 0.7s 0.20s both; }
  .hero .start-form     { animation: introFadeUp 0.7s 0.35s both; }
  .hero .start-btn-wrap { animation: introFadeUp 0.7s 0.35s both; }
  .preview-stage        { animation: introLaptop 0.9s 0.50s both; }
  @media (prefers-reduced-motion: reduce) {
    .hero h1, .hero .hero-sub, .hero .start-form, .hero .start-btn-wrap, .preview-stage {
      opacity: 1;
      animation: none;
    }
  }
  .joined {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--white);
    border: 1px solid var(--line);
    padding: 6px 14px 6px 6px;
    border-radius: 100px;
    margin-bottom: 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .avatars {
    display: flex;
  }
  .avatars span {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid var(--white);
    margin-left: -8px;
    background-size: cover;
    background-position: center;
  }
  .avatars span:first-child { margin-left: 0; }
  .avatars span:nth-child(1) { background: linear-gradient(135deg,#F4B27D,#E08B5A); }
  .avatars span:nth-child(2) { background: linear-gradient(135deg,#9FC8E6,#5C8FB5); }
  .avatars span:nth-child(3) { background: linear-gradient(135deg,#C7B6E8,#8B6FB8); }
  .avatars span:nth-child(4) { background: linear-gradient(135deg,#F0CFA0,#C99868); }
  .joined-text {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
  }
  .joined-text strong { color: var(--iron); font-weight: 600; }

  h1 {
    font-size: 68px;
    font-weight: 500;
    line-height: 1.05;
    letter-spacing: -2px;
    color: var(--ink);
    max-width: 900px;
    margin: 0 auto 22px;
  }
  h1 .accent {
    color: transparent;
    -webkit-text-fill-color: transparent;
    font-style: normal;
    font-weight: 500;
    display: inline-block;
    padding: 0.08em 0.12em 0.16em 0.04em;
    margin: -0.08em -0.12em -0.16em -0.04em;
    line-height: 1.15;
    background-image: linear-gradient(90deg,
      #FF6D05 0%,
      #F0B86E 20%,
      #E78F8E 40%,
      #1985A1 60%,
      #4E148C 80%,
      #FF6D05 100%);
    background-size: 300% 100%;
    background-position: 0% 50%;
    -webkit-background-clip: text;
    background-clip: text;
    filter: saturate(1.2);
    animation: accentShift 6s linear infinite;
  }
  @keyframes accentShift {
    0%   { background-position:   0% 50%; }
    100% { background-position: 300% 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    h1 .accent { animation: none; background-position: 0% 50%; }
  }
  .hero-sub {
    font-size: 19px;
    color: var(--muted);
    max-width: 620px;
    margin: 0 auto 40px;
    line-height: 1.5;
    font-weight: 400;
  }

  /* COMPANY + PASSKEY INPUT */
  .start-form {
    max-width: 820px;
    margin: 0 auto 22px;
    background: var(--white);
    border: 1px solid var(--alabaster);
    border-radius: 100px;
    padding: 5px 5px 5px 8px;
    display: flex;
    align-items: center;
    gap: 0;
    box-shadow: 0 8px 32px rgba(70,73,76,0.06);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .start-form:focus-within {
    border-color: var(--iron);
    box-shadow: 0 8px 32px rgba(70,73,76,0.15);
  }
  .sf-cell {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 18px;
    min-width: 0;
  }
  .sf-cell .icon {
    width: 18px; height: 18px;
    flex-shrink: 0;
    color: var(--muted);
  }
  .sf-cell input {
    flex: 1; min-width: 0;
    border: none; outline: none;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    background: transparent;
    padding: 12px 0;
  }
  .sf-cell input::placeholder { color: var(--pale-slate); }
  .sf-divider {
    width: 1px;
    align-self: stretch;
    background: var(--line);
    margin: 8px 0;
    flex: 0 0 auto;
  }
  .pk-toggle {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
    padding: 0; margin-left: 4px;
    background: transparent; border: none; border-radius: 50%;
    color: var(--muted); cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .pk-toggle:hover { color: var(--iron); background: rgba(70,73,76,0.06); }
  .pk-toggle svg { width: 18px; height: 18px; display: block; }
  .pk-toggle.is-hidden { display: none; }
  .pk-toggle .pk-eye { display: none; }
  .pk-toggle .pk-eye-off { display: block; }
  .pk-toggle[aria-pressed="true"] .pk-eye { display: block; }
  .pk-toggle[aria-pressed="true"] .pk-eye-off { display: none; }
  .start-btn-wrap { text-align: center; margin: 0 auto 18px; }
  .start-btn {
    background: var(--cyan); color: var(--white);
    padding: 0 26px; font-size: 15px; gap: 8px;
    border-radius: 100px;
    flex: 0 0 auto;
    align-self: stretch;
  }
  .start-btn:hover { background: var(--cyan); transform: scale(1.03); }
  .start-btn:disabled,
  .start-btn[disabled] {
    background: #E4E4E7;
    color: #9CA3AF;
    cursor: not-allowed;
    pointer-events: none;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  @keyframes formShake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }
  .start-form.error {
    border-color: #E15D5D;
    box-shadow: 0 0 0 3px rgba(225,93,93,0.10);
    animation: formShake 0.4s ease;
  }
  .start-error {
    font-size: 13px;
    color: #C0392B;
    text-align: center;
    min-height: 18px;
    margin: -14px auto 22px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .start-error.show { opacity: 1; }
  .retry-btn {
    display: inline-flex; align-items: center; gap: 8px;
    margin: -8px auto 20px; padding: 10px 20px;
    background: var(--white); color: var(--iron);
    border: 1px solid var(--alabaster); border-radius: 100px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .retry-btn[hidden] { display: none; }
  .retry-btn:hover { color: var(--ink); border-color: var(--iron); transform: translateY(-1px); }
  .retry-btn svg { display: block; }
  .form-hint {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 60px;
  }
  .form-hint strong { color: var(--iron); }

  /* PREVIEW WINDOW */
  .preview-stage {
    position: relative;
    left: 50%;
    transform: translate(-50%, -6%);
    width: min(1260px, calc((100vw - 48px) * 0.9));
    margin-top: 32px;
    padding: 0 0 10px;
  }
  .preview-stage::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 0;
    pointer-events: none;
    will-change: transform;
  }
  .preview-stage::after {
    width: 48%;
    height: 68%;
    right: -8%;
    bottom: -18%;
    background: radial-gradient(circle, rgba(255,138,61,0.58) 0%, rgba(255,176,110,0.3) 50%, transparent 72%);
    animation: glowDriftOrange 16s ease-in-out infinite alternate;
  }
  @keyframes glowDriftBlue {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(4%, 6%) scale(1.1); }
  }
  @keyframes glowDriftOrange {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-5%, -4%) scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce) {
    .preview-stage::before, .preview-stage::after { animation: none; }
  }
  .laptop-mockup {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    height: auto;
  }
  .preview-window {
    position: relative;
    z-index: 1;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 18px 38px rgba(70,73,76,0.08), 0 6px 12px rgba(70,73,76,0.04);
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 100%);
  }
  .pw-bar {
    background: #FAFAFB;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pw-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--alabaster); }
  .pw-dot:nth-child(1) { background: #F0A6A6; }
  .pw-dot:nth-child(2) { background: #F0D6A0; }
  .pw-dot:nth-child(3) { background: #B8D9B0; }
  .pw-url {
    margin-left: 14px;
    flex: 1;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pw-url::before {
    content: "";
    width: 10px; height: 10px;
    background: var(--cyan);
    border-radius: 50%;
    opacity: 0.7;
  }
  .pw-body {
    padding: 36px;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 32px;
    background: linear-gradient(180deg, #FFFFFF 0%, #FAFAFB 100%);
    min-height: 400px;
  }
  .pw-greeting h3 {
    font-size: 22px;
    font-weight: 600;
    color: var(--iron);
    margin-bottom: 6px;
  }
  .pw-greeting p { color: var(--muted); font-size: 14px; margin-bottom: 26px; }

  .asset-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .asset {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    transition: all 0.2s;
    cursor: pointer;
  }
  .asset:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(70,73,76,0.08);
    border-color: var(--cyan);
  }
  .asset-icon {
    width: 42px; height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    font-size: 20px;
  }
  .asset:nth-child(1) .asset-icon { background: #FFF1E6; color: #D97A3A; }
  .asset:nth-child(2) .asset-icon { background: var(--cyan-soft); color: var(--cyan); }
  .asset:nth-child(3) .asset-icon { background: #F0EBE0; color: #8B7339; }
  .asset:nth-child(4) .asset-icon { background: #EEEAF5; color: #7558A8; }
  .asset h4 { font-size: 14px; font-weight: 600; color: var(--iron); margin-bottom: 4px; }
  .asset p { font-size: 12px; color: var(--muted); line-height: 1.4; }

  /* RIGHT — BRANDED BADGE PREVIEW */
  .brand-preview {
    background: linear-gradient(135deg, #FF6D05 0%, #B24803 100%);
    border-radius: 16px;
    padding: 32px;
    color: var(--white);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 60%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0%, #000 60%, transparent 100%);
  }
  .brand-preview::after {
    content: "";
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%);
    border-radius: 50%;
  }
  .bp-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 14px;
  }
  .badge-mock {
    align-self: center;
    margin: 8px 0 16px;
    width: 150px;
    height: 150px;
    background: var(--white);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: var(--iron);
    box-shadow: 0 12px 32px rgba(0,0,0,0.18);
    position: relative;
    z-index: 1;
  }
  .badge-mock .ribbon {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--cyan);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .badge-mock .badge-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--iron);
    line-height: 1;
  }
  .badge-mock .badge-sub {
    font-size: 8px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 1px;
  }
  .badge-mock .badge-co {
    margin-top: 8px;
    font-size: 10px;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: 0.5px;
  }
  .bp-foot {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
  }
  .bp-foot .swatches { display: flex; gap: 6px; }
  .bp-foot .swatches span {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4);
  }
  .bp-foot .swatches span:nth-child(1) { background: #FFB484; }
  .bp-foot .swatches span:nth-child(2) { background: #FF6D05; }
  .bp-foot .swatches span:nth-child(3) { background: #8A3700; }
  .bp-foot .live { opacity: 0.85; }
  .bp-foot .live::before {
    content: "●";
    margin-right: 5px;
    color: #FFC79A;
  }

  /* PROOF STRIP */
  .proof-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }
  .stat {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px 26px;
    transition: all 0.2s;
  }
  .stat:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 32px rgba(70,73,76,0.08);
    border-color: var(--cyan);
  }
  .stat .num {
    font-size: 44px;
    font-weight: 600;
    color: var(--iron);
    letter-spacing: -1.5px;
    line-height: 1;
    margin-bottom: 10px;
  }
  .stat .num small { font-size: 22px; color: var(--cyan); }
  .stat .lbl { font-size: 14px; color: var(--muted); line-height: 1.4; }

  /* FEATURE STRIP */
  .features-row {
    padding: 56px 48px;
  }
  .sec-eyebrow {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--cyan);
    margin-bottom: 14px;
  }
  .sec-title {
    font-size: 40px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -1px;
    margin-bottom: 16px;
    max-width: 720px;
  }
  .sec-lead {
    font-size: 17px;
    color: var(--muted);
    max-width: 620px;
    margin-bottom: 48px;
  }
  .f-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .f-card {
    background: #FAFAFB;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px;
    transition: all 0.2s;
  }
  .f-card:hover {
    background: var(--white);
    border-color: var(--cyan);
    transform: translateY(-3px);
    box-shadow: 0 16px 36px rgba(70,73,76,0.08);
  }
  .f-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    background: var(--cyan-soft);
    color: var(--cyan);
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 16px;
    font-family: "SF Mono", Monaco, monospace;
  }
  .f-card h4 {
    font-size: 18px;
    font-weight: 600;
    color: var(--iron);
    margin-bottom: 8px;
  }
  .f-card p {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.55;
  }

  /* CTA */
  .end-cta {
    padding: 72px 56px;
    background: linear-gradient(135deg, var(--iron) 0%, var(--blue-slate) 100%);
    border-radius: 24px;
    color: var(--white);
    text-align: center;
    position: relative;
    overflow: hidden;
    border: none;
    box-shadow: 0 12px 32px rgba(70,73,76,0.12);
  }
  .end-cta::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 20% 20%, rgba(25,133,161,0.35), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(220,220,221,0.15), transparent 50%);
  }
  .end-cta > * { position: relative; z-index: 1; }
  .end-cta h2 {
    font-size: 42px;
    font-weight: 600;
    letter-spacing: -1px;
    margin-bottom: 14px;
  }
  .end-cta p {
    color: rgba(255,255,255,0.78);
    font-size: 17px;
    max-width: 560px;
    margin: 0 auto 32px;
  }
  .end-cta .btn-primary {
    background: var(--cyan);
  }
  .end-cta .btn-primary:hover { background: var(--white); color: var(--iron); }

  /* FOOTER */
  footer.page-section {
    padding: 0 40px 40px;
    color: var(--muted);
    font-size: 13px;
    position: relative;
    z-index: 1;
    margin: -30px 0 0;
    max-width: none;
  }
  .foot-grid {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    padding: 22px 32px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 -12px 30px rgba(70,73,76,0.06);
  }

  /* Responsive */
  @media (max-width: 900px) {
    .nav-links { display: none; }
    h1 { font-size: 44px; letter-spacing: -1px; }
    .hero-sub { font-size: 17px; }
    .hero { padding: 48px 0 56px; }
    .pw-body { grid-template-columns: 1fr; padding: 24px; }
    .asset-grid { grid-template-columns: 1fr 1fr; }
    .proof-grid { grid-template-columns: 1fr 1fr; }
    .f-grid { grid-template-columns: 1fr; }
    .features-row { padding: 40px 24px; }
    .sec-title { font-size: 30px; }
    .end-cta h2 { font-size: 30px; }
    .end-cta { padding: 48px 28px; }
    .start-form {
      flex-direction: column;
      border-radius: 18px;
      padding: 16px;
      gap: 10px;
    }
    .start-form input { width: 100%; padding: 10px 4px; }
    .start-form button { width: 100%; justify-content: center; }
    .card { border-radius: 18px; }
  }

  .bg-orbs { display: none !important; }

  .page-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }
  .page-bg img {
    position: absolute;
    inset: 0;
    opacity: 0.24;
    width: 100%;
    height: 100%;
    object-fit: cover;
    -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 92%);
    mask-image: linear-gradient(to bottom, #000 55%, transparent 92%);
    will-change: transform;
    animation: pageBgDrift 24s ease-in-out infinite alternate;
  }
  @keyframes pageBgDrift {
    0%   { transform: translate(0, 0) scale(1.05); }
    100% { transform: translate(-1.8%, -1.5%) scale(1.10); }
  }
  @media (prefers-reduced-motion: reduce) {
    .page-bg img { animation: none; }
  }


</style>
</head>
<body>
<div class="page-bg" aria-hidden="true"><img src="Background.svg" alt=""></div>

<div class="page-frame">

<!-- AMBIENT BG -->
<div class="bg-orbs" aria-hidden="true">
  <span class="orb orb-amber"></span>
  <span class="orb orb-cyan"></span>
  <span class="orb orb-mint"></span>
</div>

<!-- NAV -->
<nav class="top">
  <a href="https://www.vantagecircle.com" class="brand-logo" aria-label="Vantage Circle home" target="_blank" rel="noopener"><img src="Images/vc-logo-new.png" alt="Vantage Circle"></a>
  <ul class="nav-links">
    <li><a href="how-it-works.html">How it works</a></li>
  </ul>
</nav>


<!-- HERO -->
<header class="hero">
  <div class="wrap">
    <h1>See <span class="accent">your brand</span><br>on every collateral.</h1>
    <p class="hero-sub">A smarter catalogue experience where your brand comes to life across every design, instantly and effortlessly.</p>

    <form class="start-form" onsubmit="event.preventDefault(); startCatalogue();">
      <label class="sf-cell">
        <span class="sr-only">Company name</span>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/>
        </svg>
        <input id="companyInput" type="text" placeholder="Company name" autocomplete="organization">
      </label>
      <span class="sf-divider" aria-hidden="true"></span>
      <label class="sf-cell">
        <span class="sr-only">Password</span>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="8" cy="15" r="4"/>
          <path d="M10.85 12.15 21 2M15 5l3 3M18 8l2.5-2.5"/>
        </svg>
        <input id="passkeyInput" type="password" placeholder="Password" autocomplete="current-password">
        <button type="button" class="pk-toggle is-hidden" id="pkToggle" aria-label="Show password" aria-pressed="false">
          <svg class="pk-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="pk-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.5 10.5 0 0 1 12 19c-6.5 0-10-7-10-7a17.6 17.6 0 0 1 4.06-4.94"/>
            <path d="M9.9 4.24A10.5 10.5 0 0 1 12 4c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.16 4.19"/>
            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
            <path d="M2 2l20 20"/>
          </svg>
        </button>
      </label>
      <button type="submit" class="btn btn-primary start-btn" id="startBtn" disabled aria-disabled="true">
        Open catalogue
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M13 5l7 7-7 7"/>
        </svg>
      </button>
    </form>
    <div class="start-error" id="startError" role="alert" aria-live="polite"></div>
    <button type="button" class="retry-btn" id="retryBtn" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      Retry
    </button>
    <!-- PREVIEW -->
    <div class="preview-stage">
      <img class="laptop-mockup" src="Images/laptop-computer-with-blank-screen-isolated-white-background-with-clipping-path.png" alt="Catalogue preview on a laptop">
    </div>
  </div>
</header>



</div><!-- /.page-frame -->

<script>
  const REQUIRED_PASSKEY = 'Catalogue';

  function startCatalogue() {
    const company = (document.getElementById('companyInput')?.value || '').trim();
    const passkey = document.getElementById('passkeyInput')?.value || '';
    const form = document.querySelector('.start-form');
    const err = document.getElementById('startError');
    const passkeyInput = document.getElementById('passkeyInput');

    if (passkey !== REQUIRED_PASSKEY) {
      if (form) {
        form.classList.remove('error');
        void form.offsetWidth;
        form.classList.add('error');
      }
      if (err) {
        err.textContent = passkey ? 'Wrong password — please try again.' : 'Enter your password to continue.';
        err.classList.add('show');
      }
      const retry = document.getElementById('retryBtn');
      if (retry) retry.hidden = false;
      if (passkeyInput) {
        passkeyInput.value = '';
        passkeyInput.focus();
      }
      return;
    }

    try {
      const PERSIST_KEY = 'cxBadge.designState.v1';
      const fresh = JSON.parse(sessionStorage.getItem(PERSIST_KEY) || '{}');
      const next = { ...fresh };
      if (company) next.company = company;
      sessionStorage.setItem(PERSIST_KEY, JSON.stringify(next));
    } catch (e) { console.warn('[landing] persist company failed', e); }
    location.href = 'signin.html';
  }

  document.getElementById('passkeyInput')?.addEventListener('input', () => {
    document.querySelector('.start-form')?.classList.remove('error');
    document.getElementById('startError')?.classList.remove('show');
    const retry = document.getElementById('retryBtn');
    if (retry) retry.hidden = true;
  });

  document.getElementById('retryBtn')?.addEventListener('click', () => {
    document.querySelector('.start-form')?.classList.remove('error');
    document.getElementById('startError')?.classList.remove('show');
    const retry = document.getElementById('retryBtn');
    if (retry) retry.hidden = true;
    document.getElementById('passkeyInput')?.focus();
  });

  function syncStartBtn() {
    const company = (document.getElementById('companyInput')?.value || '').trim();
    const passkey = (document.getElementById('passkeyInput')?.value || '').trim();
    const btn = document.getElementById('startBtn');
    const eye = document.getElementById('pkToggle');
    const ready = company.length > 0 && passkey.length > 0;
    if (btn) {
      btn.disabled = !ready;
      btn.setAttribute('aria-disabled', String(!ready));
    }
    if (eye) eye.classList.toggle('is-hidden', !ready);
  }
  document.getElementById('companyInput')?.addEventListener('input', syncStartBtn);
  document.getElementById('passkeyInput')?.addEventListener('input', syncStartBtn);
  syncStartBtn();

  document.getElementById('pkToggle')?.addEventListener('click', (e) => {
    e.preventDefault();
    const btn = e.currentTarget;
    const input = document.getElementById('passkeyInput');
    if (!input) return;
    const showing = btn.getAttribute('aria-pressed') === 'true';
    const next = !showing;
    btn.setAttribute('aria-pressed', String(next));
    btn.setAttribute('aria-label', next ? 'Hide password' : 'Show password');
    input.type = next ? 'text' : 'password';
  });
</script>

</body>
</html>
