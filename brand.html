<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand assets — Interactive Catalogue</title>
<style>
  :root {
    --alabaster: #DCDCDD;
    --pale-slate: #C5C3C6;
    --iron: #46494C;
    --blue-slate: #4C5C68;
    --cyan: #FF6D05;
    --cyan-soft: #FFE6D4;
    --ink: #1F2125;
    --muted: #6B6E72;
    --line: #ECECEE;
    --bg: #F7F7F8;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; background-color: #ffffff; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background-color: transparent;
        background-attachment: fixed;
    line-height: 1.55;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: none; margin: 0; padding: 0 120px; }

  /* NAV — matches design-style.html safe-zone padding */
  nav.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 120px;
    max-width: none;
    margin: 0;
  }
  .nav-left { display: flex; align-items: center; gap: 18px; }
  .brand-logo { display: inline-flex; align-items: center; text-decoration: none; }
  .brand-logo img { height: 24px; width: auto; display: block; }
  .nav-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--iron);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 100px;
    transition: background 0.2s;
    border: none;
    background: transparent;
    font-family: inherit;
    cursor: pointer;
  }
  .nav-back:hover { background: rgba(255,255,255,0.6); color: var(--cyan); }
  .nav-links { display: flex; align-items: center; gap: 24px; list-style: none; }
  .nav-links a {
    color: var(--iron);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--cyan); }
  .nav-links a.nav-cta-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 100px;
    background: #29294C; color: var(--white);
    transition: background 0.2s ease;
  }
  .nav-links a.nav-cta-btn:hover { background: #1F1F3A; color: var(--white); }
  .nav-links a.nav-cta-btn svg { display: block; }
  .nav-links a.nav-profile {
    display: none; align-items: center; gap: 8px;
    padding: 4px 14px 4px 4px;
    background: var(--white); border: 1px solid var(--line); border-radius: 100px;
    color: var(--ink); font-size: 13px; font-weight: 600;
    transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }
  .nav-links a.nav-profile:hover {
    color: var(--ink); border-color: var(--alabaster);
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(70,73,76,0.06);
  }
  .nav-links a.nav-profile.show { display: inline-flex; }
  .nav-profile-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--cyan-soft); color: var(--cyan);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; overflow: hidden; flex: 0 0 auto;
  }
  .nav-profile-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .nav-profile-name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  main { padding: 0 0 120px; }
  .page-head {
    text-align: center;
    padding: 6vh 0 3vh;
    width: 100%;
    max-width: 60vw;
    margin: 0 auto;
  }

  /* STEPPER — 50% smaller version of the reference design */
  .stepper {
    display: flex; justify-content: center;
    margin: 0 auto 32px;
    max-width: 720px; position: relative;
  }
  .stepper .step {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 6px; position: relative;
  }
  .stepper .step:not(:last-child)::after {
    content: "";
    position: absolute;
    top: 7px; left: 50%;
    width: 100%; height: 1.5px;
    background: var(--alabaster);
    z-index: 0;
  }
  .stepper .step.done:not(:last-child)::after { background: #29294c; }
  .stepper .step[data-href] { cursor: pointer; }
  .stepper .step[data-href]:hover .circle { transform: scale(1.05); }
  .stepper .step[data-href]:hover .step-label { color: var(--ink); }
  .stepper .circle {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--white);
    border: 1.5px solid var(--alabaster);
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 700;
    position: relative; z-index: 1;
    transition: all 0.2s ease;
  }
  .stepper .step.done .circle { background: #29294c; border-color: #29294c; color: var(--white); }
  .stepper .step.active .circle {
    background: #29294c; border-color: #29294c; color: var(--white);
    box-shadow: 0 0 0 2px rgba(41,41,76,0.15);
  }
  .stepper .step-label { font-size: 10px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .stepper .step.active .step-label { color: var(--ink); font-weight: 700; }
  .stepper .step.done .step-label { color: var(--iron); font-weight: 600; }
  .welcome-line {
    font-size: 15px; font-weight: 500; color: var(--muted); margin-bottom: 10px;
  }
  .welcome-line span { color: var(--iron); font-weight: 600; }
  .page-head h1 {
    font-size: 40px;
    font-weight: 500;
    letter-spacing: -0.5px;
    margin-bottom: 14px;
    color: var(--ink);
    line-height: 1.15;
  }
  .page-head h1 .accent { color: var(--cyan); }
  .page-head p {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.55;
    max-width: 600px;
    margin: 0 auto;
  }

  .panel-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 1px 2px rgba(70,73,76,0.04), 0 12px 32px rgba(70,73,76,0.05);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
  }
  @media (max-width: 820px) { .form-grid { grid-template-columns: 1fr; } }

  .field { display: flex; flex-direction: column; gap: 10px; }
  .field-label { font-size: 13px; font-weight: 700; color: var(--ink); letter-spacing: 0.2px; }
  .field-hint { font-size: 12px; color: var(--muted); }

  .drop {
    position: relative;
    border: 1.5px dashed var(--alabaster);
    border-radius: 14px;
    background: #FAFAFA;
    padding: 28px 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .drop:hover { border-color: #29294C; background: #F4F5F8; }
  .drop.dragover { border-color: #29294C; background: #F0F2F8; }
  .drop input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }
  .drop-icon {
    width: 38px; height: 38px; border-radius: 12px;
    background: #EDEDEF; color: var(--iron);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .drop-title { font-size: 14px; font-weight: 600; color: var(--ink); }
  .drop-sub { font-size: 12px; color: var(--muted); }

  .file-pill {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: #F4F5F7; border-radius: 10px;
    font-size: 13px; color: var(--ink);
  }
  .file-pill .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-pill button {
    border: none; background: transparent; cursor: pointer;
    color: var(--muted); font-size: 16px; line-height: 1;
  }
  .file-pill button:hover { color: var(--ink); }

  .logo-preview {
    width: 100%; aspect-ratio: 16 / 9;
    border-radius: 12px; background: #F4F5F7;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; margin-top: 10px;
  }
  .logo-preview img { max-width: 80%; max-height: 80%; object-fit: contain; }
  .logo-preview img[src*="Preview.svg"] { max-width: 24%; max-height: 24%; opacity: 0.1; }

  .extracted {
    margin-top: 14px;
    padding: 14px;
    border: 1px solid var(--line); border-radius: 12px;
    background: #FAFAFA;
  }
  .extracted h4 {
    font-size: 12px; font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
  }
  .extracted-swatches { display: flex; gap: 14px; flex-wrap: wrap; }
  .ext-swatch {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .ext-swatch .ext-color {
    width: 44px; height: 44px; border-radius: 10px;
    border: 1px solid rgba(0,0,0,0.05);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
  }
  .ext-swatch .hex {
    font-size: 10px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--muted); white-space: nowrap;
  }
  .extracted-empty { color: var(--muted); font-size: 13px; }

  .field input[type="text"], .field input[type="url"] {
    width: 100%; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 10px;
    font-family: inherit; font-size: 14px; color: var(--ink); background: var(--white);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .field input[type="text"]:focus,
  .field input[type="url"]:focus {
    border-color: #29294C; box-shadow: 0 0 0 3px rgba(41,41,76,0.10);
  }

  .url-list { display: flex; flex-direction: column; gap: 8px; }
  .url-row { display: flex; align-items: center; gap: 8px; }
  .url-row input { flex: 1; }
  .url-row button {
    border: 1px solid var(--line); background: var(--white); color: var(--muted);
    width: 38px; height: 38px; border-radius: 10px;
    cursor: pointer; font-size: 16px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .url-row button:hover { border-color: var(--alabaster); color: var(--ink); }
  .add-url-btn {
    align-self: flex-start;
    border: 1px dashed var(--alabaster); background: transparent;
    color: var(--iron); padding: 8px 12px;
    border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .add-url-btn:hover { color: var(--ink); border-color: #29294C; }

  .foot {
    position: fixed;
    right: 32px; bottom: 84px;
    z-index: 9999;
    display: flex; align-items: center; gap: 16px;
    padding: 10px 12px 10px 22px;
    background: #FFFFFF;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 100px;
    box-shadow: 0 12px 32px rgba(70,73,76,0.14), 0 2px 6px rgba(70,73,76,0.06);
  }
  .panel-card { padding-bottom: 100px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 22px;
    border-radius: 100px; border: none;
    font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s ease;
  }
  .btn-primary { background: var(--cyan); color: var(--white); }
  .btn-primary:hover { background: var(--iron); transform: translateY(-1px); }

  .page-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }
  .page-bg img {
    position: absolute;
    inset: 0;
    opacity: 0.24;
    width: 100%;
    height: 100%;
    object-fit: cover;
    -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 92%);
    mask-image: linear-gradient(to bottom, #000 55%, transparent 92%);
    will-change: transform;
    animation: pageBgDrift 24s ease-in-out infinite alternate;
  }
  @keyframes pageBgDrift {
    0%   { transform: translate(0, 0) scale(1.05); }
    100% { transform: translate(-1.8%, -1.5%) scale(1.10); }
  }
  @media (prefers-reduced-motion: reduce) {
    .page-bg img { animation: none; }
  }



  .back-fab {
    position: fixed;
    left: 32px; bottom: 84px;
    z-index: 9999;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 22px;
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: 100px;
    color: var(--iron);
    font-family: inherit; font-size: 14px; font-weight: 600;
    text-decoration: none;
    box-shadow: 0 12px 32px rgba(70,73,76,0.10), 0 2px 6px rgba(70,73,76,0.05);
    transition: color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .back-fab:hover { color: var(--ink); border-color: var(--iron); transform: translateY(-1px); }
  .back-fab svg { display: block; }

</style>
</head>
<body>
<div class="page-bg" aria-hidden="true"><img src="Background.svg" alt=""></div>


<nav class="top">
  <div class="nav-left">
    <a href="https://www.vantagecircle.com" class="brand-logo" aria-label="Vantage Circle home" target="_blank" rel="noopener"><img src="Images/vc-logo-new.png" alt="Vantage Circle"></a>
  </div>
  <ul class="nav-links">
    <li><a href="how-it-works.html">How it works</a></li>
    <li><a href="profile.html" class="nav-profile" id="navProfile" aria-label="View your profile">
      <span class="nav-profile-avatar" id="navProfileAvatar"></span>
      <span class="nav-profile-name" id="navProfileName"></span>
    </a></li>
  </ul>
</nav>
<script>
  (function() {
    try {
      var ps = JSON.parse(sessionStorage.getItem('cxBadge.designState.v1') || '{}');
      var company = (ps.company || '').trim();
      if (!company) return;
      var chip = document.getElementById('navProfile');
      var avatar = document.getElementById('navProfileAvatar');
      var nameEl = document.getElementById('navProfileName');
      if (!chip || !avatar || !nameEl) return;
      nameEl.textContent = 'Profile';
      var colors = (ps.brand && ps.brand.colors) || [];
      var primary = colors[0];
      if (primary) {
        avatar.style.background = primary;
        avatar.style.color = 'transparent';
        avatar.textContent = '';
      } else {
        avatar.textContent = company.charAt(0).toUpperCase();
      }
      chip.classList.add('show');
    } catch (e) {}
  })();
</script>

<main>
  <div class="wrap">
    <div class="panel-card">
      <div class="form-grid">

        <!-- LEFT: Logo -->
        <div class="field">
          <div class="field-label">Company logo</div>
          <div class="field-hint">PNG, JPG, or SVG — we'll extract your brand colors from it.</div>
          <label class="drop" id="logoDrop">
            <div class="drop-icon">⬆</div>
            <div class="drop-title">Drag &amp; drop or click to upload</div>
            <div class="drop-sub">PNG · JPG · SVG · up to 4 MB</div>
            <input type="file" id="logoInput" accept="image/png,image/jpeg,image/svg+xml">
          </label>
          <div id="logoFilePill"></div>
          <div class="logo-preview" id="logoPreview">
            <img id="logoImg" src="Icons/Preview.svg" alt="Logo preview">
          </div>
          <div class="extracted" id="extractedBox" hidden>
            <h4>Extracted brand colors</h4>
            <div class="extracted-swatches" id="extractedSwatches"></div>
          </div>
        </div>

        <!-- RIGHT: Documents + URLs -->
        <div class="field">
          <div class="field-label">Brand guidelines (optional)</div>
          <div class="field-hint">PDF or image. We'll keep it as reference.</div>
          <label class="drop" id="docDrop" style="padding: 18px 14px;">
            <div class="drop-icon">📄</div>
            <div class="drop-title">Upload a brand document</div>
            <div class="drop-sub">PDF · PNG · JPG · up to 8 MB</div>
            <input type="file" id="docInput" accept="application/pdf,image/*">
          </label>
          <div id="docFilePill"></div>

          <div class="field-label" style="margin-top: 18px;">Company website</div>
          <input type="url" id="websiteUrl" placeholder="https://yourcompany.com">

          <div class="field-label" style="margin-top: 18px;">Other URLs (social, careers, etc.)</div>
          <div class="url-list" id="urlList">
            <div class="url-row">
              <input type="url" placeholder="https://linkedin.com/company/...">
              <button type="button" class="remove-url" aria-label="Remove">×</button>
            </div>
          </div>
          <button type="button" class="add-url-btn" id="addUrlBtn">+ Add another URL</button>
        </div>

      </div>

      <div class="foot">
        <button type="button" class="btn btn-primary" id="continueBtn">Save and continue →</button>
      </div>
    </div>
  </div>
</main>

<script>
  const PERSIST_KEY = 'cxBadge.designState.v1';
  const persisted = (() => {
    try { return JSON.parse(sessionStorage.getItem(PERSIST_KEY) || '{}'); } catch { return {}; }
  })();
  const brand = persisted.brand || {};

  // Company name (from URL or persisted state)
  const company = (new URLSearchParams(location.search).get('company') || persisted.company || '').trim();
  const companyEl = document.getElementById('companyName');
  if (companyEl) companyEl.textContent = company || 'there';
  const headingCompanyEl = document.getElementById('headingCompany');
  if (headingCompanyEl) headingCompanyEl.textContent = company || 'Your';

  // Restore prior values if present
  const websiteInput = document.getElementById('websiteUrl');
  if (brand.website) websiteInput.value = brand.website;

  const urlList = document.getElementById('urlList');
  if (Array.isArray(brand.urls) && brand.urls.length) {
    urlList.innerHTML = '';
    brand.urls.forEach(u => addUrlRow(u));
  }
  if (brand.logoDataUrl) renderLogo(brand.logoDataUrl, brand.logoName || 'logo');
  if (brand.docName) renderDocPill(brand.docName);
  if (Array.isArray(brand.colors) && brand.colors.length) renderExtracted(brand.colors);

  // --- Logo handling
  const logoInput = document.getElementById('logoInput');
  const logoDrop = document.getElementById('logoDrop');
  setupDrop(logoDrop, logoInput, handleLogoFile);
  logoInput.addEventListener('change', () => {
    if (logoInput.files && logoInput.files[0]) handleLogoFile(logoInput.files[0]);
  });

  function handleLogoFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    if (file.size > 4 * 1024 * 1024) { alert('Logo must be under 4 MB.'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      const dataUrl = e.target.result;
      brand.logoDataUrl = dataUrl;
      brand.logoName = file.name;
      renderLogo(dataUrl, file.name);
      autoSaveEnabled = true;
      autoSave();
      extractColors(dataUrl).then(colors => {
        brand.colors = colors;
        // UC6: persist a darker shade of the extracted color so the monetary
        // (and non-monetary) award BG stays in sync everywhere — survives
        // reload + back navigation, only cleared on manual reset.
        if (colors[0]) {
          brand.awardBg = darkenHex(colors[0], 0.45);
          brand.monetaryAwardBg = darkenHex(brand.awardBg, 0.35);
        }
        renderExtracted(colors);
        autoSave();
      });
    };
    reader.readAsDataURL(file);
  }

  // Auto-save: once a logo is uploaded, every subsequent change writes to sessionStorage.
  let autoSaveEnabled = !!brand.logoDataUrl;
  function autoSave() {
    if (!autoSaveEnabled) return;
    brand.website = websiteInput.value.trim();
    brand.urls = [...urlList.querySelectorAll('.url-row input')]
      .map(i => i.value.trim()).filter(Boolean);
    let fresh = {};
    try { fresh = JSON.parse(sessionStorage.getItem(PERSIST_KEY) || '{}'); } catch (e) { console.warn('[brand autoSave] read failed', e); }
    const next = { ...fresh, brand };
    try { sessionStorage.setItem(PERSIST_KEY, JSON.stringify(next)); }
    catch (e) { console.warn('[brand autoSave] write failed', e); }
  }
  websiteInput.addEventListener('input', autoSave);
  urlList.addEventListener('input', autoSave);
  urlList.addEventListener('click', () => setTimeout(autoSave, 0)); // catch url row removals

  function renderLogo(dataUrl, name) {
    const img = document.getElementById('logoImg');
    img.src = dataUrl;
    document.getElementById('logoFilePill').innerHTML = `
      <div class="file-pill">
        <span>🖼</span>
        <span class="name">${escapeHtml(name)}</span>
        <button type="button" id="removeLogo" aria-label="Remove">×</button>
      </div>`;
    document.getElementById('removeLogo').addEventListener('click', () => {
      brand.logoDataUrl = null; brand.logoName = null; brand.colors = [];
      img.src = 'Icons/Preview.svg';
      document.getElementById('logoFilePill').innerHTML = '';
      document.getElementById('extractedBox').hidden = true;
      logoInput.value = '';
      autoSave();
    });
  }

  // --- Color extraction (canvas sampling + 4-bit per-channel histogram)
  async function extractColors(dataUrl) {
    return new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const max = 160;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, w, h);
        let data;
        try { data = ctx.getImageData(0, 0, w, h).data; }
        catch (err) { resolve([]); return; }
        const buckets = new Map();
        for (let i = 0; i < data.length; i += 4) {
          const a = data[i + 3];
          if (a < 128) continue;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          // Skip near-white and near-black so the dominant brand color wins.
          const max3 = Math.max(r, g, b), min3 = Math.min(r, g, b);
          if (max3 > 240 && min3 > 240) continue;
          if (max3 < 25) continue;
          const key = ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);
          const slot = buckets.get(key) || { r: 0, g: 0, b: 0, n: 0 };
          slot.r += r; slot.g += g; slot.b += b; slot.n += 1;
          buckets.set(key, slot);
        }
        const sorted = [...buckets.values()].sort((a, b) => b.n - a.n);
        // Keep only saturated brand colors; dedupe by hue so anti-aliased tints
        // (e.g. pinks from a red logo edge) collapse into their parent hue.
        const picked = []; // { hex, hue, sat, n }
        for (const s of sorted) {
          const r = Math.round(s.r / s.n), g = Math.round(s.g / s.n), bl = Math.round(s.b / s.n);
          const [h, sat, l] = rgbToHsl(r, g, bl);
          if (sat < 0.45) continue;            // skip washed-out tints
          if (l < 0.12 || l > 0.92) continue;  // skip near-black/near-white
          const hex = '#' + [r, g, bl].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
          const dup = picked.find(p => hueDistance(p.hue, h) < 25);
          if (dup) continue; // already have this hue family (more dominant)
          picked.push({ hex, hue: h, sat, n: s.n });
          if (picked.length >= 4) break;
        }
        resolve(picked.map(p => p.hex));
      };
      img.onerror = () => resolve([]);
      img.src = dataUrl;
    });
  }
  function colorDistance(a, b) {
    const pa = parseHex(a), pb = parseHex(b);
    return Math.sqrt((pa[0]-pb[0])**2 + (pa[1]-pb[1])**2 + (pa[2]-pb[2])**2);
  }
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const l = (max + min) / 2;
    let h = 0, s = 0;
    if (max !== min) {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r: h = ((g - b) / d + (g < b ? 6 : 0)); break;
        case g: h = ((b - r) / d + 2); break;
        case b: h = ((r - g) / d + 4); break;
      }
      h *= 60;
    }
    return [h, s, l];
  }
  function hueDistance(a, b) {
    const d = Math.abs(a - b) % 360;
    return d > 180 ? 360 - d : d;
  }
  function darkenHex(hex, amount) {
    const m = (hex || '').match(/^#?([0-9a-f]{6})$/i);
    if (!m) return hex;
    const r = Math.max(0, Math.round(parseInt(m[1].slice(0,2), 16) * (1 - amount)));
    const g = Math.max(0, Math.round(parseInt(m[1].slice(2,4), 16) * (1 - amount)));
    const b = Math.max(0, Math.round(parseInt(m[1].slice(4,6), 16) * (1 - amount)));
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
  }
  function lightenHex(hex, amount) {
    // Mix hex toward white by `amount` (0..1). Mirrors darkenHex so the two
    // together give shades of a picked color rather than arbitrary greys.
    const m = (hex || '').match(/^#?([0-9a-f]{6})$/i);
    if (!m) return hex;
    const mix = (c) => Math.min(255, Math.round(c + (255 - c) * amount));
    const r = mix(parseInt(m[1].slice(0,2), 16));
    const g = mix(parseInt(m[1].slice(2,4), 16));
    const b = mix(parseInt(m[1].slice(4,6), 16));
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
  }
  function parseHex(h) {
    const m = h.match(/^#([0-9a-f]{6})$/i);
    if (!m) return [0,0,0];
    const v = m[1];
    return [parseInt(v.slice(0,2), 16), parseInt(v.slice(2,4), 16), parseInt(v.slice(4,6), 16)];
  }

  function renderExtracted(colors) {
    const box = document.getElementById('extractedBox');
    const row = document.getElementById('extractedSwatches');
    if (!colors || !colors.length) {
      box.hidden = true; row.innerHTML = '';
      return;
    }
    box.hidden = false;
    row.innerHTML = colors.map(c =>
      `<div class="ext-swatch"><div class="ext-color" style="background:${c};"></div><span class="hex">${c}</span></div>`
    ).join('');
  }

  // --- Document handling
  const docInput = document.getElementById('docInput');
  const docDrop = document.getElementById('docDrop');
  setupDrop(docDrop, docInput, handleDocFile);
  docInput.addEventListener('change', () => {
    if (docInput.files && docInput.files[0]) handleDocFile(docInput.files[0]);
  });
  function handleDocFile(file) {
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) { alert('Document must be under 8 MB.'); return; }
    // Don't base64 large PDFs into sessionStorage — just remember the name.
    brand.docName = file.name;
    renderDocPill(file.name);
    autoSave();
  }
  function renderDocPill(name) {
    document.getElementById('docFilePill').innerHTML = `
      <div class="file-pill">
        <span>📎</span>
        <span class="name">${escapeHtml(name)}</span>
        <button type="button" id="removeDoc" aria-label="Remove">×</button>
      </div>`;
    document.getElementById('removeDoc').addEventListener('click', () => {
      brand.docName = null;
      document.getElementById('docFilePill').innerHTML = '';
      docInput.value = '';
      autoSave();
    });
  }

  // --- Drag & drop helper
  function setupDrop(zone, input, onFile) {
    ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, e => {
      e.preventDefault(); zone.classList.add('dragover');
    }));
    ['dragleave', 'drop'].forEach(ev => zone.addEventListener(ev, e => {
      e.preventDefault(); zone.classList.remove('dragover');
    }));
    zone.addEventListener('drop', e => {
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) onFile(f);
    });
  }

  // --- URL list
  document.getElementById('addUrlBtn').addEventListener('click', () => addUrlRow(''));
  urlList.addEventListener('click', e => {
    if (e.target.classList.contains('remove-url')) {
      const rows = urlList.querySelectorAll('.url-row');
      if (rows.length > 1) e.target.closest('.url-row').remove();
      else e.target.closest('.url-row').querySelector('input').value = '';
    }
  });
  function addUrlRow(value) {
    const row = document.createElement('div');
    row.className = 'url-row';
    row.innerHTML = `
      <input type="url" placeholder="https://..." value="${escapeHtml(value || '')}">
      <button type="button" class="remove-url" aria-label="Remove">×</button>`;
    urlList.appendChild(row);
  }

  // --- Save and navigate
  document.getElementById('continueBtn').addEventListener('click', () => {
    saveAndGo(false);
  });
  // Back-to-landing must NOT nuke the session on ordinary navigation.
  // Reset is opt-in: shift-click the nav link and confirm the destructive prompt.
  const navBackLandingEl = document.getElementById('navBackLanding');
  if (navBackLandingEl) navBackLandingEl.addEventListener('click', (e) => {
    if (!e.shiftKey) return;
    if (!confirm('Start over? This will erase your company name, brand colors, uploaded logo, and every award customization.')) {
      e.preventDefault();
      return;
    }
    try { sessionStorage.removeItem(PERSIST_KEY); }
    catch (e) { console.warn('[brand reset] removeItem failed', e); }
  });
  function saveAndGo(skipped) {
    brand.website = websiteInput.value.trim();
    brand.urls = [...urlList.querySelectorAll('.url-row input')]
      .map(i => i.value.trim()).filter(Boolean);
    brand.skipped = !!skipped;
    // Read fresh sessionStorage so auto-saves done by other pages aren't clobbered.
    let fresh = {};
    try { fresh = JSON.parse(sessionStorage.getItem(PERSIST_KEY) || '{}'); } catch (e) { console.warn('[brand saveAndGo] read failed', e); }
    const next = { ...fresh, brand };
    try { sessionStorage.setItem(PERSIST_KEY, JSON.stringify(next)); }
    catch (e) { console.warn('[brand saveAndGo] write failed', e); }
    location.href = 'bundles.html' + (company ? '?company=' + encodeURIComponent(company) : '');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }
</script>

<a href="profile.html" class="back-fab" id="pageBackFab" aria-label="Back"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</a>
<script>
  (function() {
    var fab = document.getElementById('pageBackFab');
    if (!fab) return;
    // Preserve the current query string so bundle/company/selected context
    // isn't lost when the user pops back a step.
    var base = fab.getAttribute('href');
    fab.setAttribute('href', base + (location.search || ''));
  })();
</script>
